services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://fileflow:fileflow@db:5432/fileflow
      STORAGE_BACKEND: local
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
    command: ["uv", "run", "python", "-m", "app.worker.run"]
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://fileflow:fileflow@db:5432/fileflow
      STORAGE_BACKEND: local
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fileflow
      POSTGRES_USER: fileflow
      POSTGRES_PASSWORD: fileflow
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileflow -d fileflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: